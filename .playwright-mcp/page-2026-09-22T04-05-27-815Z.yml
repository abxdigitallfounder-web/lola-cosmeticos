                  - generic [ref=f1046e357]:
                    - text: Como usar
                    - generic [ref=f1046e358]: "Ideal para cabelos frágeis, enfraquecidos, quebradiços ou com dificuldade de crescimento saudável. O Kit Rapunzel combina limpeza estimulante, acidificação fortificante, tratamento da fibra capilar, cuidado diário do couro cabeludo e proteção para comprimento e pontas. Com ativos como Ginkgo biloba, Cafeína, Sodium PCA, ácidos málico, láctico e cítrico, além de extratos vegetais fortalecedores, a rotina auxilia na redução da quebra, no fortalecimento da raiz às pontas e na melhora da resistência dos fios. O novo Rapunzel Acidificante complementa o protocolo ao reequilibrar o pH, reduzir a porosidade e preparar os fios para receber melhor a Máscara Fortificante. Benefícios • Rotina completa de crescimento e fortalecimento capilar; • Limpeza estimulante e refrescante para o couro cabeludo; • Reequilíbrio do pH dos fios; • Redução da porosidade; • Fortalecimento da fibra capilar; • Auxilia na prevenção da quebra; • Ajuda no crescimento saudável dos fios; • Hidratação, desembaraço e proteção para comprimento e pontas; • Fios mais fortes, macios, resistentes e brilhantes. Este kit contém • Rapunzel Shampoo Rejuvenescedor 250ml: limpeza estimulante e refrescante para o couro cabeludo; • Rapunzel Acidificante 250ml: reequilíbrio do pH, redução da porosidade e fortalecimento da fibra capilar; • Rapunzel Máscara 450g: fortalecimento da fibra capilar, brilho, maciez e redução da quebra; • Rapunzel Tônico do Crescimento 250ml: estímulo ao crescimento saudável e fortalecimento da raiz; • Rapunzel Milk Spray Leave-in 250ml: hidratação leve, desembaraço e proteção para fios frágeis."
