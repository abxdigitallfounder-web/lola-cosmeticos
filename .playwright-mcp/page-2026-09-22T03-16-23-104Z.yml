                  - generic [ref=f143e399]:
                    - text: Como usar
                    - generic [ref=f143e401]:
                      - text: O Volumão Shampoo é o primeiro passo para cabelos com mais corpo, brilho e movimento. Ideal para fios finos, murchinhos ou sem graça, limpa suavemente, ajuda a desobstruir a raiz e devolve a leveza essencial para o volume acontecer desde a raiz.
                      - paragraph [ref=f143e402]:
                        - generic [ref=f143e403]:
                          - strong [ref=f143e404]: Benefícios
